name: groundwork

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: groundwork-postgres
    environment:
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: groundwork
      POSTGRES_DB: groundwork
    ports:
      - "5432:5432"
      # A developer machine with its own PostgreSQL wins on 5432 and silently shadows this
      # container, which has already cost debugging time. 5433 always reaches the container.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundwork -d groundwork"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Not started by default. Docker Desktop cannot reach the Apple Silicon GPU, so a containerised
  # Ollama runs on emulated CPU: measured at 7.2 tok/s for llama3.2:3b against 40 tok/s from the
  # same model served natively on the same machine. Run Ollama on the host instead (see README).
  #
  # This service remains for hosts where the container *can* use the GPU — Linux with the NVIDIA
  # container toolkit — and for a self-contained demo where speed does not matter:
  #     docker compose --profile bundled-ollama up
  ollama:
    image: ollama/ollama:latest
    container_name: groundwork-ollama
    profiles: ["bundled-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
    container_name: groundwork-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://groundwork:groundwork@postgres:5432/groundwork
      # The host's Ollama, which on macOS is the only one with GPU access. Override in .env with
      # http://ollama:11434 when running the bundled-ollama profile.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    # Docker Desktop provides this name; the mapping keeps the same compose file working on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: groundwork-frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: groundwork_postgres_data
  ollama_data:
    name: groundwork_ollama_data
